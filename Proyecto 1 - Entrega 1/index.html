<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaphor Model Report</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
  color: #333;
}
#sidebar {
  width: 300px;
  min-width: 200px;
  background: #f5f5f5;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#sidebar-header {
  padding: 12px;
  border-bottom: 1px solid #ddd;
}
#sidebar-header h2 {
  font-size: 14px;
  margin-bottom: 8px;
  color: #555;
}
#search {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 13px;
}
#tree-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}
#welcome-view h1 {
  margin-bottom: 12px;
}
#welcome-view p {
  color: #666;
  margin-bottom: 20px;
}
.diagram-card {
  display: inline-block;
  padding: 10px 16px;
  margin: 4px;
  border: 1px solid #ddd;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  color: #333;
  background: #fff;
}
.diagram-card:hover {
  background: #e8f0fe;
  border-color: #4285f4;
}
.tree-list {
  list-style: none;
  padding-left: 16px;
}
.tree-list.root {
  padding-left: 4px;
}
.tree-node {
  cursor: pointer;
  padding: 3px 8px;
  font-size: 13px;
  border-radius: 3px;
  white-space: nowrap;
  display: flex;
  align-items: center;
}
.tree-node:hover {
  background: #e0e0e0;
}
.tree-node.active {
  background: #d2e3fc;
}
.tree-toggle,
.tree-icon {
  display: inline-block;
  width: 16px;
  text-align: center;
  font-size: 10px;
  flex-shrink: 0;
}
.tree-toggle {
  color: #888;
}
.tree-icon {
  color: #666;
}
.tree-label {
  margin-left: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tree-children {
  display: none;
}
.tree-children.open {
  display: block;
}
.tree-group {
  font-style: italic;
  color: #888;
}
.hidden {
  display: none !important;
}
#diagram-header {
  margin-bottom: 16px;
}
#diagram-header h2 {
  font-size: 18px;
}
#diagram-content {
  overflow: hidden;
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 4px;
  position: relative;
  height: calc(100vh - 120px);
}
#diagram-content svg {
  width: 100%;
  height: 100%;
}
.zoom-controls {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 10;
}
.zoom-controls button {
  width: 32px;
  height: 32px;
  border: 1px solid #ccc;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
}
.zoom-controls button:hover {
  background: #e8f0fe;
  border-color: #4285f4;
}
#element-view h2 {
  margin-bottom: 4px;
}
#element-type {
  color: #888;
  font-size: 13px;
  margin-bottom: 16px;
}
#element-details {
  margin-bottom: 20px;
}
.props-table {
  border-collapse: collapse;
  width: 100%;
  max-width: 600px;
}
.props-table th,
.props-table td {
  text-align: left;
  padding: 6px 12px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}
.props-table th {
  color: #666;
  width: 160px;
}
#element-diagrams h3 {
  font-size: 14px;
  margin-bottom: 8px;
}
#element-diagrams a {
  display: inline-block;
  margin: 2px 6px;
  color: #4285f4;
  text-decoration: none;
}
#element-diagrams a:hover {
  text-decoration: underline;
}
.element-section {
  margin-bottom: 16px;
}
.element-section h3 {
  font-size: 14px;
  color: #555;
  margin-bottom: 6px;
  border-bottom: 1px solid #eee;
  padding-bottom: 4px;
}
.element-section ul {
  list-style: none;
  padding: 0;
}
.element-section li {
  padding: 3px 0;
  font-size: 13px;
}
.element-section code {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 12px;
  background: #f5f5f5;
  padding: 2px 6px;
  border-radius: 3px;
}
.stereotype-tag {
  display: inline-block;
  background: #e8f0fe;
  color: #1a73e8;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 10px;
  margin: 2px 4px 2px 0;
}
.element-section a {
  color: #4285f4;
  text-decoration: none;
}
.element-section a:hover {
  text-decoration: underline;
}
.assoc-table {
  border-collapse: collapse;
  width: 100%;
  max-width: 700px;
}
.assoc-table th,
.assoc-table td {
  text-align: left;
  padding: 6px 12px;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}
.assoc-table th {
  color: #666;
  font-weight: 600;
}
#element-panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 45%;
  background: #fff;
  border-top: 2px solid #ccc;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
  transition: transform 0.2s ease;
  z-index: 20;
  display: flex;
  flex-direction: column;
}
#element-panel.panel-hidden {
  transform: translateY(100%);
}
#panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid #eee;
  flex-shrink: 0;
}
#panel-header h3 {
  font-size: 14px;
  margin: 0;
}
#panel-type {
  color: #888;
  font-size: 12px;
}
#panel-close {
  margin-left: auto;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #888;
  padding: 0 4px;
  line-height: 1;
}
#panel-close:hover {
  color: #333;
}
#panel-body {
  overflow-y: auto;
  padding: 12px 16px;
  flex: 1;
}
#panel-body .element-section {
  margin-bottom: 12px;
}
#panel-body .element-section h3 {
  font-size: 13px;
}
#panel-body .props-table th,
#panel-body .props-table td {
  padding: 4px 10px;
}

</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Model Browser</h2>
    <input type="text" id="search" placeholder="Search..." autocomplete="off">
  </div>
  <div id="tree-container"></div>
</div>
<div id="main">
  <div id="welcome-view">
    <h1>Model Report</h1>
    <p>Select a diagram or element from the sidebar, or choose a diagram below.</p>
    <div id="diagram-list"></div>
  </div>
  <div id="diagram-view" style="display:none;">
    <div id="diagram-header"><h2 id="diagram-title"></h2></div>
    <div id="diagram-content"></div>
  </div>
  <div id="element-view" style="display:none;">
    <h2 id="element-title"></h2>
    <div id="element-type"></div>
    <div id="element-details"></div>
    <div id="element-diagrams"></div>
  </div>
  <div id="element-panel" class="panel-hidden">
    <div id="panel-header">
      <h3 id="panel-title"></h3>
      <span id="panel-type"></span>
      <button id="panel-close" title="Close">&times;</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

      label.className = "tree-label";

    return ul;
  }

  /* Wrap content in a titled section div for consistent element detail layout. */
  function makeSection(title, content) {
    var sec = document.createElement("div");
    sec.className = "element-section";
    var h3 = document.createElement("h3");
    h3.textContent = title;
    sec.appendChild(h3);
    sec.appendChild(content);
    return sec;
  }

  /*
   * Render all detail sections for a model element (properties, stereotypes,
   * attributes, operations, associations, etc.) into the given container.
   * Shared between the full-page element view and the slide-up panel so
   * both show identical content.
   */
  function renderElementDetails(el, container) {
    container.innerHTML = "";

    if (el.properties && el.properties.length > 0) {
      var table = document.createElement("table");
      table.className = "props-table";
      el.properties.forEach(function(p) {
        var tr = document.createElement("tr");
        var th = document.createElement("th");
        th.textContent = p.name;
        var td = document.createElement("td");
        td.textContent = p.value;
        tr.appendChild(th);
        tr.appendChild(td);
        table.appendChild(tr);
      });
      container.appendChild(makeSection("Properties", table));
    }

    if (el.stereotypes && el.stereotypes.length > 0) {
      var div = document.createElement("div");
      el.stereotypes.forEach(function(s) {
        var span = document.createElement("span");
        span.className = "stereotype-tag";
        span.textContent = "\u00ab" + s + "\u00bb";
        div.appendChild(span);
      });
      container.appendChild(makeSection("Stereotypes", div));
    }

    if (el.attributes && el.attributes.length > 0) {
      container.appendChild(makeSection("Attributes", makeCodeList(el.attributes)));
    }

    if (el.operations && el.operations.length > 0) {
      container.appendChild(makeSection("Operations", makeCodeList(el.operations)));
    }

    if (el.literals && el.literals.length > 0) {
      container.appendChild(makeSection("Enumeration Literals", makePlainList(el.literals)));
    }

    if (el.associations && el.associations.length > 0) {
      var table = document.createElement("table");
      table.className = "assoc-table";
      var thead = document.createElement("thead");
      var hr = document.createElement("tr");
      ["Type", "End Name", "Multiplicity", "Aggregation", "Navigable"].forEach(function(h) {
        var th = document.createElement("th");
        th.textContent = h;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tbody = document.createElement("tbody");
      el.associations.forEach(function(a) {
        var tr = document.createElement("tr");
        [a.type, a.name || "-", a.multiplicity || "-", a.aggregation, a.navigable ? "Yes" : "No"].forEach(function(v) {
          var td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      container.appendChild(makeSection("Association Ends", table));
    }

    if (el.generalizations && el.generalizations.length > 0) {
      var ul = document.createElement("ul");
      el.generalizations.forEach(function(g) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#element/" + g.id;
        a.textContent = g.name + " (" + g.type + ")";
        li.appendChild(a);
        ul.appendChild(li);
      });
      container.appendChild(makeSection("Generalizations", ul));
    }

    if (el.diagrams && el.diagrams.length > 0) {
      var dDiv = document.createElement("div");
      el.diagrams.forEach(function(d) {
        var a = document.createElement("a");
        a.href = "#diagram/" + d.id;
        a.textContent = d.name || "(unnamed)";
        a.style.marginRight = "10px";
        dDiv.appendChild(a);
      });
      container.appendChild(makeSection("Appears in diagrams", dDiv));
    }
  }

  /* Format an element's display title, prepending stereotypes in guillemets. */
  function elementTitle(el) {
    var t = el.name || el.formatted || "(unnamed)";
    if (el.stereotypes && el.stereotypes.length > 0) {
      t = "\u00ab" + el.stereotypes.join(", ") + "\u00bb " + t;
    }
    return t;
  }

  /* Show the full-page element detail view (used when no diagram is active). */
  function showElement(id) {
    var el = data.elements[id];
    if (!el) return;

    closePanel();
    $("#element-title").textContent = elementTitle(el);
    $("#element-type").textContent = el.type;
    renderElementDetails(el, $("#element-details"));
    $("#element-diagrams").innerHTML = "";

    $("#element-view").style.display = "";
    activateTreeNode(id);
  }

  // Tracks whether a diagram is currently displayed, so the router
  // knows to use the slide-up panel for element navigation instead
  // of replacing the diagram view.
  var diagramVisible = false;

  /*
   * Show element details in a slide-up panel overlaying the diagram.
   * This keeps the diagram visible while inspecting an element clicked
   * in the SVG overlay.
   */
  function showPanel(id) {
    var el = data.elements[id];
    if (!el) return;

    $("#panel-title").textContent = elementTitle(el);
    $("#panel-type").textContent = el.type;
    renderElementDetails(el, $("#panel-body"));
    $("#element-panel").classList.remove("panel-hidden");
  }

  function closePanel() {
    $("#element-panel").classList.add("panel-hidden");
  }

  $("#panel-close").addEventListener("click", closePanel);

  /*
   * Highlight a node in the sidebar tree and expand all its ancestor
   * nodes so it becomes visible. This keeps the tree in sync with
   * whatever is shown in the main content area.
   */
  function activateTreeNode(id) {
    var n = document.querySelector('.tree-node[data-id="' + id + '"]');
    if (!n) return;
    n.classList.add("active");
    // Walk up the DOM to expand collapsed ancestor containers,
    // so the active node is visible without manual tree navigation
    var parent = n.parentElement;
    while (parent) {
      if (parent.classList && parent.classList.contains("tree-children")) {
        parent.classList.add("open");
        var toggle = parent.previousElementSibling;
        if (toggle) {
          var t = toggle.querySelector(".tree-toggle");
          if (t) t.textContent = "\u25bc";
        }
      }
      parent = parent.parentElement;
    }
    n.scrollIntoView({block: "nearest"});
  }

  // Live-filter the sidebar tree by substring match on node names.
  // When a query is active, all tree sections are forced open so
  // matches nested deep in the hierarchy are visible.
  $("#search").addEventListener("input", function() {
    var q = this.value.toLowerCase().trim();
    var allNodes = $$(".tree-node");

    if (!q) {
      // No query: show everything, collapse tree
      allNodes.forEach(function(n) { n.parentElement.classList.remove("hidden"); });
      $$(".tree-children").forEach(function(c) { c.classList.remove("open"); });
      return;
    }

    // Hide all first
    allNodes.forEach(function(n) { n.parentElement.classList.add("hidden"); });

    // Show matches and their ancestors
    allNodes.forEach(function(n) {
      if (n.dataset.name && n.dataset.name.indexOf(q) !== -1) {
        var el = n.parentElement;
        while (el) {
          if (el.tagName === "LI") el.classList.remove("hidden");
          if (el.classList && el.classList.contains("tree-children")) el.classList.add("open");
          el = el.parentElement;
        }
      }
    });
  });

  // Run the router on hash changes and on initial page load
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
